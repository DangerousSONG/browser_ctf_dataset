# Version baselines from the reproduction spec. Do not mix schema vs CLI versions.

[pipeline]
name = "exploit-data-spec-eval"
commit = "8c76c2e3f6fe885a19d9297fe88b6a1372f4dd90"

[exploitbench]
repo = "https://github.com/exploitbench/exploitbench.git"
commit = "9d0173bcf8835b74a45f60450ae7f184e29e7607"
path = "third_party/exploitbench"
bench_v8 = "benchmarks/bench-v8"
# Dedup baseline: do not re-count bugs already in this commit's TARGETS.
dedup_baseline_commit = "9d0173bcf8835b74a45f60450ae7f184e29e7607"

[harbor]
cli = "0.15.0"
task_schema_version = "1.3"

[depot_tools]
commit = "364ccfdd5f1346dc973b66ab5f088a4ec88ca8c6"

[build]
platform = "linux/amd64"
os = "ubuntu-x86_64"
# Official bench-v8 numbers. One CVE => one image.
image_size_gb = "65-70"
disk_free_gb_per_bug = 100
build_minutes = 60
